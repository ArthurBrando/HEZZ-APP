<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HEZZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff;
  --gold:#e8b923;
  --gold-light:#fdeaa8;
  --gold-soft:#fffaeb;
  --pastel-blue:#d6e4f0;
  --pastel-pink:#f0d9e8;
  --pastel-green:#d9ead3;
  --text:#2b2b2b;
  --text-soft:#6a6a6a;
  --muted:#9a9a9a;
  --danger:#e26a6a;
  --online:#7bc47f;
  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --sh-sm:0 2px 8px rgba(0,0,0,.05);
  --sh-md:0 8px 24px rgba(0,0,0,.08);
  --sh-lg:0 24px 64px rgba(0,0,0,.15);
  --sw:280px;
  --so:0px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Inter',system-ui,sans-serif;background:var(--white);
  color:var(--text);height:100%;overflow:hidden;}

/* ===== Views ===== */
.view{
  position:fixed;inset:0;background:var(--white);z-index:150;
  display:none;flex-direction:column;overflow-y:auto;
}
.view.active{display:flex;}
.view-header{
  display:flex;align-items:center;gap:16px;padding:16px 20px;
  border-bottom:1px solid var(--gold-light);background:var(--white);
  position:sticky;top:0;z-index:10;
}
.back-btn{
  background:none;border:none;cursor:pointer;display:grid;place-items:center;
  padding:8px;border-radius:50%;transition:background .2s;
}
.back-btn:hover{background:var(--gold-soft);}
.back-btn svg{width:24px;height:24px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.view-title{font-size:1.2rem;font-weight:700;flex:1;}

/* ===== Main ===== */
.main-content{
  position:fixed;inset:0;padding:40px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(135deg,var(--pastel-blue) 0%,var(--white) 40%,var(--gold-soft) 100%);
}
.main-content h1{
  font-size:2.5rem;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--pastel-pink) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ===== Sidebar ===== */
.sidebar{
  position:fixed;top:0;left:0;width:var(--sw);height:100vh;height:100dvh;
  background:var(--white);border-right:1px solid var(--gold-light);
  display:flex;flex-direction:column;padding:24px 16px;padding-bottom:max(24px,env(safe-area-inset-bottom));
  z-index:100;box-shadow:var(--sh-md);
  transform:translateX(calc(var(--so) - var(--sw)));
  transition:transform .4s var(--ease);
}
.sidebar.no-trans{transition:none;}
.sidebar-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 8px 20px;border-bottom:1px solid var(--gold-soft);margin-bottom:12px;
}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:3px;color:var(--gold);}

.error-banner{
  background:#fde4e4;color:#b04040;padding:10px 12px;border-radius:12px;
  font-size:.75rem;line-height:1.4;margin-bottom:10px;display:flex;gap:8px;
  align-items:flex-start;
}
.error-banner svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;
  stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.error-banner.hidden{display:none;}

.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:14px;padding:12px 16px;
  border-radius:var(--r-md);color:var(--text);text-decoration:none;
  font-weight:500;font-size:.92rem;cursor:pointer;position:relative;
  transition:background .2s,transform .2s var(--ease);
}
.nav-item:hover{transform:translateX(4px);}
.nav-item.active{background:var(--gold-light);}
.icon{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* Botão de criar servidor */
.create-server-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px;margin-top:8px;border-radius:var(--r-md);
  background:var(--pastel-green);color:var(--text);font-weight:600;
  border:none;cursor:pointer;transition:background .2s,transform .2s;
}
.create-server-btn:hover{background:#c9dcb5;}
.create-server-btn:active{transform:scale(.98);}
.create-server-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}

/* ===== Perfil ===== */
.profile-card{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:var(--r-md);background:var(--pastel-blue);cursor:pointer;
  margin-top:12px;transition:transform .2s var(--ease),box-shadow .2s;
  flex-shrink:0;
}
.profile-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
.profile-card:active{transform:scale(.98);}
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar{width:40px;height:40px;border-radius:12px;object-fit:cover;
  border:2px solid var(--white);background:var(--pastel-pink);display:block;}
.avatar-state{
  position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--white);background:var(--muted);transition:background .3s;
}
.avatar-state.online{background:var(--online);}
.avatar-state.offline{background:var(--muted);}
.avatar-state.disabled{background:var(--danger);}
.profile-info{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;}
.nick{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.status-text{font-size:.72rem;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.edit-hint{width:14px;height:14px;flex-shrink:0;stroke:var(--text-soft);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ===== Handle ===== */
#drag-handle{
  position:fixed;top:50%;left:var(--so);transform:translateY(-50%);
  width:26px;height:70px;background:var(--white);border-radius:0 14px 14px 0;
  box-shadow:4px 0 12px rgba(0,0,0,.06);display:grid;place-items:center;
  cursor:grab;z-index:101;touch-action:none;
  border:1px solid var(--gold-light);border-left:none;
  transition:left .4s var(--ease),background .2s;
}
#drag-handle.no-trans{transition:background .2s;}
#drag-handle:active{cursor:grabbing;}
#drag-handle:hover{background:var(--gold-light);}
#drag-handle svg{width:16px;height:16px;stroke:var(--gold);fill:none;
  stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
#drag-handle .dot{fill:var(--gold);stroke:none;}

/* ===== Formulários ===== */
.form-container{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:540px;margin:0 auto;width:100%;}
.form-group{display:flex;flex-direction:column;gap:8px;}
.form-group label{font-size:.85rem;font-weight:600;color:var(--text);}
.form-group input[type=text],.form-group input[type=url],.form-group textarea{
  padding:12px;border:2px solid var(--gold-light);border-radius:var(--r-sm);
  font-family:inherit;font-size:.9rem;outline:none;background:var(--white);
  color:var(--text);transition:border-color .2s,background .2s;
}
.form-group input:focus,.form-group textarea:focus{
  border-color:var(--gold);background:var(--gold-soft);
}
.form-group textarea{resize:vertical;min-height:80px;}

.preview-banner{
  height:160px;background-color:var(--pastel-pink);background-size:cover;
  background-position:center;border-radius:var(--r-md);position:relative;
  transition:background .3s;display:flex;align-items:flex-end;padding:16px;
}
.preview-avatar{
  width:80px;height:80px;border-radius:20px;border:4px solid var(--white);
  object-fit:cover;background:var(--pastel-green);box-shadow:var(--sh-sm);
  margin-bottom:-40px;
}
.gradient-controls{
  display:flex;align-items:center;gap:12px;background:var(--gold-soft);
  padding:12px;border-radius:var(--r-sm);margin-top:10px;
}
.gradient-controls label{font-size:.8rem;display:flex;align-items:center;gap:8px;cursor:pointer;}
.gradient-controls input[type=color]{
  width:32px;height:32px;border:none;border-radius:50%;cursor:pointer;padding:0;
  background:none;
}
.gradient-controls input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
.gradient-controls input[type=color]::-webkit-color-swatch{border:2px solid var(--white);border-radius:50%;box-shadow:var(--sh-sm);}

.upload-row{display:flex;gap:8px;align-items:stretch;}
.upload-row input[type=url]{flex:1;min-width:0;}
.upload-btn{
  display:inline-flex;align-items:center;gap:6px;padding:10px 14px;
  border-radius:var(--r-sm);background:var(--pastel-blue);color:var(--text);
  font-weight:600;font-size:.8rem;cursor:pointer;
  transition:background .2s,transform .15s;white-space:nowrap;flex-shrink:0;
}
.upload-btn:hover{background:var(--pastel-pink);}
.upload-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.upload-btn input[type=file]{display:none;}

.btn{
  padding:12px 24px;border-radius:var(--r-sm);border:none;font-family:inherit;
  font-weight:600;font-size:.9rem;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;
  transition:transform .15s,background .2s,box-shadow .2s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--gold);color:var(--white);box-shadow:0 4px 14px rgba(232,185,35,.35);}
.btn-primary:hover{background:#d4a91a;}
.btn-secondary{background:var(--pastel-blue);color:var(--text);}
.btn-secondary:hover{background:#c6d6e6;}

/* ===== Chat ===== */
.chat-messages{
  flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;
  background:linear-gradient(180deg,var(--white) 0%, var(--gold-soft) 100%);
}
.message{
  display:flex;gap:12px;max-width:85%;
}
.message.own{align-self:flex-end;flex-direction:row-reverse;}
.message-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--pastel-blue);}
.message-content{
  background:var(--white);padding:10px 14px;border-radius:var(--r-md);
  box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:4px;
  border:1px solid var(--gold-light);
}
.message.own .message-content{background:var(--gold-light);border-color:var(--gold);}
.message-header{display:flex;justify-content:space-between;gap:10px;font-size:.7rem;color:var(--text-soft);}
.message-sender{font-weight:600;color:var(--text);}
.message-text{font-size:.9rem;line-height:1.4;word-break:break-word;}
.message-image{max-width:100%;border-radius:var(--r-sm);margin-top:4px;cursor:pointer;}

.chat-input-area{
  padding:16px 20px;background:var(--white);border-top:1px solid var(--gold-light);
  display:flex;align-items:center;gap:8px;position:sticky;bottom:0;
}
.chat-input{
  flex:1;padding:12px 16px;border:2px solid var(--gold-light);border-radius:999px;
  font-family:inherit;font-size:.9rem;outline:none;background:var(--gold-soft);
  transition:border-color .2s;
}
.chat-input:focus{border-color:var(--gold);}
.chat-btn{
  width:44px;height:44px;border-radius:50%;border:none;background:var(--pastel-blue);
  cursor:pointer;display:grid;place-items:center;transition:background .2s,transform .15s;
  flex-shrink:0;
}
.chat-btn:hover{background:var(--pastel-pink);}
.chat-btn:active{transform:scale(.9);}
.chat-btn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.chat-btn.record{background:#ffe4e4;}
.chat-btn.record.recording{background:var(--danger);animation:pulse 1.5s infinite;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
.chat-btn.record.recording svg{stroke:white;}

/* Emoji Picker */
.emoji-picker{
  position:absolute;bottom:70px;left:20px;background:var(--white);
  border-radius:var(--r-md);box-shadow:var(--sh-lg);border:1px solid var(--gold-light);
  width:300px;max-height:250px;overflow-y:auto;display:none;
  grid-template-columns:repeat(6, 1fr);padding:10px;gap:4px;z-index:20;
}
.emoji-picker.show{display:grid;}
.emoji-btn{
  background:none;border:none;font-size:1.5rem;cursor:pointer;
  padding:4px;border-radius:8px;transition:background .2s;
}
.emoji-btn:hover{background:var(--gold-soft);}

/* Custom Audio Player */
.custom-audio-player{
  display:flex;align-items:center;gap:10px;background:var(--pastel-blue);
  padding:8px 12px;border-radius:999px;min-width:200px;
}
.custom-audio-player .play-btn{
  width:32px;height:32px;border-radius:50%;background:var(--white);border:none;
  cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh-sm);flex-shrink:0;
}
.custom-audio-player .play-btn svg{width:14px;height:14px;fill:var(--text);}
.custom-audio-player .progress-track{
  flex:1;height:6px;background:rgba(255,255,255,0.5);border-radius:3px;
  cursor:pointer;position:relative;overflow:hidden;
}
.custom-audio-player .progress-fill{
  position:absolute;left:0;top:0;height:100%;background:var(--gold);
  width:0%;border-radius:3px;transition:width .1s linear;
}
.custom-audio-player .time{
  font-size:.7rem;font-weight:600;color:var(--text);min-width:30px;text-align:right;
}

@media(max-width:640px){
  .main-content{padding:24px 20px;}
  .main-content h1{font-size:1.8rem;}
}
</style>
</head>
<body>

<main class="main-content">
  <h1>HEZZ</h1>
</main>

<div id="drag-handle" aria-label="Abrir menu">
  <svg viewBox="0 0 24 24">
    <circle class="dot" cx="12" cy="7" r="1.6"/>
    <circle class="dot" cx="12" cy="12" r="1.6"/>
    <circle class="dot" cx="12" cy="17" r="1.6"/>
  </svg>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><span class="logo">HEZZ</span></div>

  <div id="firebase-error-banner" class="error-banner hidden">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="firebase-error-text"></span>
  </div>

  <nav class="sidebar-nav">
    <a href="#" class="nav-item active" data-nav="home">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
      <span>Início</span>
    </a>
    
    <button class="create-server-btn" id="btn-open-create-server">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Criar Servidor
    </button>

    <a href="#" class="nav-item" data-nav="messages">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Mensagens</span>
    </a>
    <a href="#" class="nav-item" data-nav="calls">
      <svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
      <span>Chamadas</span>
    </a>
    <a href="#" class="nav-item" data-nav="settings">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Configurações</span>
    </a>
  </nav>

  <div class="profile-card" id="profile-card">
    <div class="avatar-wrap">
      <img id="sidebar-avatar" class="avatar" alt="Avatar"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23d6e4f0'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%23e8b923'/%3E%3Cpath d='M6 40c2-8 8-12 14-12s12 4 14 12z' fill='%23e8b923'/%3E%3C/svg%3E" />
      <span id="sidebar-state-dot" class="avatar-state"></span>
    </div>
    <div class="profile-info">
      <span id="sidebar-nick" class="nick">Carregando...</span>
      <span id="sidebar-status-text" class="status-text">Conectando...</span>
    </div>
    <svg class="edit-hint" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </div>
</aside>

<!-- VIEW: EDITAR PERFIL -->
<div class="view" id="view-profile">
  <div class="view-header">
    <button class="back-btn" onclick="closeView('view-profile')">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span class="view-title">Editar Perfil</span>
    <button class="btn btn-primary" id="save-profile-btn" style="padding:8px 16px;font-size:.8rem;">Salvar</button>
  </div>
  
  <form class="form-container" id="profile-form">
    <div class="form-group">
      <label>Banner</label>
      <div class="preview-banner" id="preview-banner">
        <img id="preview-avatar" class="preview-avatar" alt="Avatar" 
             src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%23d9ead3'/%3E%3Ccircle cx='40' cy='32' r='14' fill='%23e8b923'/%3E%3Cpath d='M12 80c4-16 16-24 28-24s24 8 28 24z' fill='%23e8b923'/%3E%3C/svg%3E" />
      </div>
      <div class="upload-row" style="margin-top:40px;">
        <input type="url" id="banner-url" placeholder="URL do Banner" />
        <label class="upload-btn">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload
          <input type="file" id="banner-file" accept="image/*" />
        </label>
      </div>
    </div>

    <div class="gradient-controls">
      <label>
        <input type="checkbox" id="gradient-toggle" />
        Usar Gradiente no Fundo
      </label>
      <div style="flex:1;display:flex;gap:8px;justify-content:flex-end;">
        <input type="color" id="gradient-top" value="#d6e4f0" title="Cor de cima" />
        <input type="color" id="gradient-bottom" value="#f0d9e8" title="Cor de baixo" />
      </div>
    </div>

    <div class="form-group">
      <label>Foto de Perfil</label>
      <div class="upload-row">
        <input type="url" id="avatar-url" placeholder="URL da Foto" />
        <label class="upload-btn">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload
          <input type="file" id="avatar-file" accept="image/*" />
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>Nick</label>
      <input type="text" id="nick-input" maxlength="32" placeholder="Seu nick" />
    </div>

    <div class="form-group">
      <label>Bio</label>
      <textarea id="bio-input" maxlength="300" placeholder="Fale sobre você..."></textarea>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, update, get, onValue, onDisconnect, query, orderByChild, endAt, remove, push, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBk0TzSvq4T4f27RbCUtHblQxvmkAI0dHE",
  authDomain: "hezz-gg.firebaseapp.com",
  databaseURL: "https://hezz-gg-default-rtdb.firebaseio.com",
  projectId: "hezz-gg",
  storageBucket: "hezz-gg.firebasestorage.app",
  messagingSenderId: "944032998353",
  appId: "1:944032998353:web:e5b079c669c2f6f3a736f0"
};

const SIDEBAR_W      = 280;
const MAX_FILE_SIZE  = 5 * 1024 * 1024;
const TTL_OFFLINE_MS = 30 * 60 * 1000;
const HEARTBEAT_MS   = 60 * 1000;

let currentUser = null;
let userProfile = {};
let isSidebarOpen = false;
let heartbeatInt = null;
let profileUnsub = null;
let editBanner = "";
let editAvatar = "";

let currentServerId = null;
let chatUnsub = null;

// Media Recorder Variables
let mediaRecorder;
let audioChunks = [];
let isRecording = false;

const $ = (id) => document.getElementById(id);
const sidebar       = $("sidebar");
const dragHandle    = $("drag-handle");
const profileCard   = $("profile-card");

/* ===== Init Firebase ===== */
let app, auth, db;
try {
  app  = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db   = getDatabase(app);
} catch (e) {
  console.error("[HEZZ] Falha ao inicializar Firebase:", e);
  showErrorBanner("Falha ao inicializar Firebase: " + e.message);
}

function showErrorBanner(msg){
  $("firebase-error-text").textContent = msg;
  $("firebase-error-banner").classList.remove("hidden");
}

/* ===== Navegação e Telas ===== */
window.closeView = function(viewId) {
  $(viewId).classList.remove("active");
  if (viewId === 'view-chat' && chatUnsub) {
    chatUnsub();
    chatUnsub = null;
    currentServerId = null;
  }
}

function openView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $(viewId).classList.add('active');
}

/* ===== Sidebar Drag Logic ===== */
function setOffset(px, animate = true) {
  document.documentElement.style.setProperty("--so", `${px}px`);
  if (!animate) {
    sidebar.classList.add("no-trans");
    dragHandle.classList.add("no-trans");
  } else {
    sidebar.classList.remove("no-trans");
    dragHandle.classList.remove("no-trans");
  }
}
function setOpen(open) {
  isSidebarOpen = open;
  setOffset(open ? SIDEBAR_W : 0, true);
}
let drag = { active:false, startX:0, startOffset:0, moved:false };
dragHandle.addEventListener("pointerdown", (e) => {
  drag.active = true; drag.moved = false;
  drag.startX = e.clientX;
  drag.startOffset = isSidebarOpen ? SIDEBAR_W : 0;
  setOffset(drag.startOffset, false);
  dragHandle.setPointerCapture(e.pointerId);
  e.preventDefault();
});
window.addEventListener("pointermove", (e) => {
  if (!drag.active) return;
  const delta = e.clientX - drag.startX;
  if (Math.abs(delta) > 4) drag.moved = true;
  setOffset(Math.max(0, Math.min(SIDEBAR_W, drag.startOffset + delta)), false);
});
window.addEventListener("pointerup", (e) => {
  if (!drag.active) return;
  drag.active = false;
  if (!drag.moved) setOpen(!isSidebarOpen);
  else setOpen(drag.startOffset + (e.clientX - drag.startX) > SIDEBAR_W / 2);
});

/* ===== Toast ===== */
let toastTimer = null;
function showToast(msg){
  $("toast-text").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2500);
}

/* ===== Login e Auth ===== */
if (auth) {
  signInAnonymously(auth).catch((err) => {
    showErrorBanner("Erro no Auth: " + (err.code || err.message) + " — ative 'Anônimo' no console.");
  });

  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    currentUser = user;
    try {
      await ensureUserDoc(user.uid);
      startHeartbeat(user.uid);
      setupDisconnect(user.uid);
      subscribeProfile(user.uid);
    } catch (err) {
      showErrorBanner("Erro no banco: " + (err.code || err.message));
    }
  });
}

async function ensureUserDoc(uid){
  const userRef = ref(db, `users/${uid}`);
  const snap = await get(userRef);
  if (!snap.exists()){
    await set(userRef, {
      uid,
      nick: "Anônimo_" + uid.slice(0,4),
      bio: "", status: "", state: "online", avatarUrl: "", bannerUrl: "",
      gradientEnabled: false, gradientTop: "#d6e4f0", gradientBottom: "#f0d9e8",
      isAnonymous: true, createdAt: Date.now(), lastSeen: Date.now(), expireAt: Date.now() + TTL_OFFLINE_MS
    });
  } else {
    await update(userRef, { lastSeen: Date.now(), expireAt: Date.now() + TTL_OFFLINE_MS });
  }
}

function startHeartbeat(uid){
  if (heartbeatInt) clearInterval(heartbeatInt);
  heartbeatInt = setInterval(() => {
    if (!currentUser) return;
    update(ref(db, `users/${uid}`), { lastSeen: Date.now(), expireAt: Date.now() + TTL_OFFLINE_MS }).catch(() => {});
  }, HEARTBEAT_MS);
}

function setupDisconnect(uid){
  onDisconnect(ref(db, `users/${uid}/expireAt`)).set(Date.now() + TTL_OFFLINE_MS);
  onDisconnect(ref(db, `users/${uid}/lastSeen`)).set(Date.now());
}

function subscribeProfile(uid){
  if (profileUnsub) profileUnsub();
  profileUnsub = onValue(ref(db, `users/${uid}`), (snap) => {
    userProfile = snap.val();
    if (userProfile) renderProfile(userProfile);
  });
}

function renderProfile(d){
  $("sidebar-nick").textContent = d.nick || "Anônimo";
  $("sidebar-status-text").textContent = d.status || labelState(d.state);
  if (d.avatarUrl) $("sidebar-avatar").src = d.avatarUrl;
  $("sidebar-state-dot").className = "avatar-state " + (d.state || "offline");
}
function labelState(s){
  if (s === "online") return "Online";
  if (s === "disabled") return "Desativado";
  return "Offline";
}

/* ===== PERFIL: Lógica de Edição ===== */
profileCard.addEventListener("click", () => {
  if (!currentUser) { showToast("Aguarde conectar..."); return; }
  loadProfileIntoForm();
  openView('view-profile');
});

function applyPreview(){
  const banner = editBanner || $("banner-url").value.trim();
  const avatar = editAvatar || $("avatar-url").value.trim();
  const useGrad = $("gradient-toggle").checked;
  const gTop = $("gradient-top").value;
  const gBot = $("gradient-bottom").value;

  const pBanner = $("preview-banner");
  if (useGrad) {
    pBanner.style.backgroundImage = "none";
    pBanner.style.background = `linear-gradient(to bottom, ${gTop}, ${gBot})`;
  } else if (banner) {
    pBanner.style.backgroundImage = `url("${banner}")`;
    pBanner.style.background = ""; // reset gradient
    pBanner.style.backgroundImage = `url("${banner}")`;
  } else {
    pBanner.style.backgroundImage = "";
    pBanner.style.background = "var(--pastel-pink)";
  }

  if (avatar) $("preview-avatar").src = avatar;
  else $("preview-avatar").src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%23d9ead3'/%3E%3Ccircle cx='40' cy='32' r='14' fill='%23e8b923'/%3E%3Cpath d='M12 80c4-16 16-24 28-24s24 8 28 24z' fill='%23e8b923'/%3E%3C/svg%3E";
}

['banner-url', 'avatar-url', 'gradient-top', 'gradient-bottom'].forEach(id => {
  $(id).addEventListener("input", () => { if(id.includes('url')) editBanner = ""; applyPreview(); });
});
$("gradient-toggle").addEventListener("change", applyPreview);

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    if (file.size > MAX_FILE_SIZE) { reject(new Error("Arquivo > 5MB")); return; }
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

$("banner-file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { editBanner = await fileToBase64(f); $("banner-url").value = ""; applyPreview(); } catch (err) { showToast(err.message); }
});
$("avatar-file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { editAvatar = await fileToBase64(f); $("avatar-url").value = ""; applyPreview(); } catch (err) { showToast(err.message); }
});

function loadProfileIntoForm(){
  const d = userProfile || {};
  $("nick-input").value = d.nick || "";
  $("bio-input").value = d.bio || "";
  $("state-input").value = d.state || "online";
  $("status-input").value = d.status || "";
  $("banner-url").value = d.bannerUrl && !d.bannerUrl.startsWith("data:") ? d.bannerUrl : "";
  $("avatar-url").value = d.avatarUrl && !d.avatarUrl.startsWith("data:") ? d.avatarUrl : "";
  editBanner = d.bannerUrl && d.bannerUrl.startsWith("data:") ? d.bannerUrl : "";
  editAvatar = d.avatarUrl && d.avatarUrl.startsWith("data:") ? d.avatarUrl : "";
  
  $("gradient-toggle").checked = d.gradientEnabled || false;
  $("gradient-top").value = d.gradientTop || "#d6e4f0";
  $("gradient-bottom").value = d.gradientBottom || "#f0d9e8";
  
  applyPreview();
}

$("save-profile-btn").addEventListener("click", async () => {
  if (!currentUser) return;
  const payload = {
    nick: $("nick-input").value.trim() || "Anônimo",
    bio: $("bio-input").value.trim(),
    state: $("state-input").value,
    status: $("status-input").value.trim(),
    bannerUrl: editBanner || $("banner-url").value.trim(),
    avatarUrl: editAvatar || $("avatar-url").value.trim(),
    gradientEnabled: $("gradient-toggle").checked,
    gradientTop: $("gradient-top").value,
    gradientBottom: $("gradient-bottom").value,
    lastSeen: Date.now(),
    expireAt: Date.now() + TTL_OFFLINE_MS
  };
  try {
    await update(ref(db, `users/${currentUser.uid}`), payload);
    showToast("Perfil salvo!");
    closeView('view-profile');
  } catch (err) { showToast("Erro ao salvar: " + err.message); }
});

/* ===== CRIAR SERVIDOR ===== */
$("btn-open-create-server").addEventListener("click", () => {
  if (!currentUser) { showToast("Aguarde conectar..."); return; }
  openView('view-create-server');
});

let editServerAvatar = "";
$("server-avatar-file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { editServerAvatar = await fileToBase64(f); $("server-avatar-url").value = ""; } catch (err) { showToast(err.message); }
});

$("create-server-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!currentUser) return;
  
  const name = $("server-name").value.trim();
  const bio = $("server-bio").value.trim();
  const avatarUrl = editServerAvatar || $("server-avatar-url").value.trim();
  
  const serverRef = push(ref(db, "servers"));
  const serverId = serverRef.key;
  
  try {
    await set(serverRef, {
      id: serverId,
      name: name,
      bio: bio,
      avatarUrl: avatarUrl,
      ownerUid: currentUser.uid,
      createdAt: Date.now()
    });
    
    // Criar chat geral implícito ao abrir
    $("create-server-form").reset();
    editServerAvatar = "";
    showToast("Servidor criado!");
    openChat(serverId, name, bio, avatarUrl);
  } catch (err) {
    showToast("Erro ao criar: " + err.message);
  }
});

/* ===== CHAT SYSTEM ===== */
function openChat(serverId, name, bio, avatarUrl) {
  currentServerId = serverId;
  $("chat-header-name").textContent = name;
  $("chat-header-bio").textContent = bio || "Chat Geral";
  if(avatarUrl) $("chat-header-avatar").src = avatarUrl;
  else $("chat-header-avatar").src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23d6e4f0'/%3E%3C/svg%3E";
  
  openView('view-chat');
  
  const msgsContainer = $("chat-messages");
  msgsContainer.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.8rem;margin:20px;">Carregando mensagens...</div>';
  
  if (chatUnsub) chatUnsub();
  const chatRef = query(ref(db, `servers/${serverId}/chats/geral`), limitToLast(50));
  
  chatUnsub = onValue(chatRef, (snap) => {
    msgsContainer.innerHTML = "";
    const msgs = [];
    snap.forEach((child) => { msgs.push({ id: child.key, ...child.val() }); });
    
    if (msgs.length === 0) {
      msgsContainer.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.8rem;margin:20px;">Nenhuma mensagem ainda. Diga oi!</div>';
      return;
    }
    
    msgs.forEach(m => renderMessage(m, msgsContainer));
    msgsContainer.scrollTop = msgsContainer.scrollHeight;
  });
}

function renderMessage(m, container) {
  const isOwn = m.senderUid === currentUser.uid;
  const msgEl = document.createElement("div");
  msgEl.className = `message ${isOwn ? 'own' : ''}`;
  
  let contentHtml = '';
  if (m.type === 'text') {
    contentHtml = `<div class="message-text">${escapeHTML(m.text)}</div>`;
  } else if (m.type === 'image') {
    contentHtml = `<img src="${m.imageUrl}" class="message-image" onclick="window.open('${m.imageUrl}', '_blank')" />`;
  } else if (m.type === 'audio') {
    contentHtml = createAudioPlayerHTML(m.audioUrl);
  }
  
  const time = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  
  msgEl.innerHTML = `
    <img src="${m.senderAvatar || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 40 40\'%3E%3Crect width=\'40\' height=\'40\' fill=\'%23d6e4f0\'/%3E%3C/svg%3E'}" class="message-avatar" />
    <div class="message-content">
      <div class="message-header">
        <span class="message-sender">${escapeHTML(m.senderNick)}</span>
        <span class="message-time">${time}</span>
      </div>
      ${contentHtml}
    </div>
  `;
  
  container.appendChild(msgEl);
  
  // Attach audio player events if audio
  if (m.type === 'audio') {
    const player = msgEl.querySelector('.custom-audio-player');
    const audio = player.querySelector('audio');
    const playBtn = player.querySelector('.play-btn');
    const progressFill = player.querySelector('.progress-fill');
    const timeEl = player.querySelector('.time');
    const track = player.querySelector('.progress-track');
    
    playBtn.addEventListener('click', () => {
      if (audio.paused) { audio.play(); playBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'; }
      else { audio.pause(); playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>'; }
    });
    
    audio.addEventListener('timeupdate', () => {
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      timeEl.textContent = formatTime(audio.currentTime);
    });
    
    audio.addEventListener('ended', () => {
      playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      progressFill.style.width = '0%';
      timeEl.textContent = '0:00';
    });
    
    track.addEventListener('click', (e) => {
      const rect = track.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });
  }
}

function createAudioPlayerHTML(src) {
  return `
    <div class="custom-audio-player">
      <button class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
      <div class="progress-track"><div class="progress-fill"></div></div>
      <span class="time">0:00</span>
      <audio src="${src}" preload="metadata"></audio>
    </div>
  `;
}

function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

async function sendMessage(payload) {
  if (!currentServerId || !currentUser) return;
  payload.senderUid = currentUser.uid;
  payload.senderNick = userProfile.nick || "Anônimo";
  payload.senderAvatar = userProfile.avatarUrl || "";
  payload.timestamp = Date.now();
  
  try {
    await push(ref(db, `servers/${currentServerId}/chats/geral`), payload);
  } catch (err) {
    showToast("Erro ao enviar: " + err.message);
  }
}

// Text Send
$("btn-send").addEventListener("click", () => {
  const text = $("chat-input").value.trim();
  if (!text) return;
  sendMessage({ type: 'text', text });
  $("chat-input").value = "";
});
$("chat-input").addEventListener("keypress", (e) => {
  if (e.key === 'Enter') $("btn-send").click();
});

// Image Send
$("chat-image-upload").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > MAX_FILE_SIZE) { showToast("Imagem muito grande (máx 5MB)"); return; }
  try {
    const base64 = await fileToBase64(f);
    sendMessage({ type: 'image', imageUrl: base64 });
  } catch (err) { showToast(err.message); }
  e.target.value = "";
});

// Emoji Picker
const emojis = "😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🤭 🤫 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🥴 🤢 🤮 🤧 😷 🤒 🤕 🤑 🤠 😈 👿 👹 👺 🤡 💩 👻 💀 👽 👾 🤖 🎃 😺 😸 😹 😻 😼 😽 🙀 😿 😾".split(" ");
const picker = $("emoji-picker");
emojis.forEach(e => {
  const btn = document.createElement("button");
  btn.className = "emoji-btn";
  btn.type = "button";
  btn.textContent = e;
  btn.onclick = () => {
    $("chat-input").value += e;
    $("chat-input").focus();
  };
  picker.appendChild(btn);
});

$("btn-emoji").addEventListener("click", (e) => {
  e.stopPropagation();
  picker.classList.toggle("show");
});
document.addEventListener("click", (e) => {
  if (!picker.contains(e.target) && e.target !== $("btn-emoji")) {
    picker.classList.remove("show");
  }
});

// Audio Recording
$("btn-record").addEventListener("click", async () => {
  if (isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    $("btn-record").classList.remove("recording");
    return;
  }
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => {
        const base64Audio = reader.result;
        sendMessage({ type: 'audio', audioUrl: base64Audio });
      };
      reader.readAsDataURL(audioBlob);
      stream.getTracks().forEach(track => track.stop());
    };
    
    mediaRecorder.start();
    isRecording = true;
    $("btn-record").classList.add("recording");
    showToast("Gravando áudio...");
  } catch (err) {
    showToast("Erro ao acessar microfone: " + err.message);
  }
});

</script>
